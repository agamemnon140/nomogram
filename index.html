  <script>
    // Limpar service workers antigos que podem bloquear atualização
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
      if (caches) caches.keys().then(function(names) {
        for (var n of names) { caches.delete(n); }
      });
    }
  </script>

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    body{font-family:-apple-system,SF Pro Text,Helvetica Neue,sans-serif;background:#f2f2f7}
    @media(prefers-color-scheme:dark){body{background:#000}}
  </style>
